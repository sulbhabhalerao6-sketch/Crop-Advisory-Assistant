kind = "web"
previewPath = "/"
title = "Crop Advisory Assistant"
description = "A mobile-first agricultural assistant that helps farmers capture field conditions, receive structured crop guidance, and manage advisory history."
version = "1.0.0"
id = "artifacts/crop-advisory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19577

[services.development]
run = "pnpm --filter @workspace/crop-advisory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crop-advisory", "run", "build" ]
serve = "static"
publicDir = "artifacts/crop-advisory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19577"
BASE_PATH = "/"
